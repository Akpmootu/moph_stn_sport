<style>
[hidden]{display:none!important}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0 34px}.choice-card{background:#102846;color:#fff;border:2px solid #34516e;border-radius:18px;padding:22px;text-align:left;cursor:pointer;font:inherit;transition:transform .18s,border-color .18s}.choice-card:hover{transform:translateY(-3px)}.choice-card[aria-pressed=true]{border-color:#bcff40;box-shadow:0 0 0 2px #bcff4033}.choice-card strong,.choice-card small{display:block}.choice-card small{margin-top:8px;line-height:1.6;color:#d0daeb}.team-dot{display:inline-block;width:22px;height:22px;border-radius:50%;margin-bottom:10px;background:var(--team-color)}.wizard-progress{display:flex;flex-wrap:wrap;gap:12px;list-style:none;padding:0;margin:0 0 28px;color:#a8bdcf}.wizard-progress li{padding:8px 14px;background:#173451;border-radius:20px}.contact-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:16px 0}.contact-row label{display:grid;gap:8px}.contact-row input,.manage-form input,.manage-form select,.manage-form textarea{background:#0b223d;color:#fff;border:1px solid #56728d;border-radius:10px;padding:12px;font:inherit;width:100%}.contact-row button{padding:12px}.sport-countdown{display:block;margin-top:12px;color:#c4ff68;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.8}.receipt-card{background:linear-gradient(135deg,#112c50,#07182f);border:2px solid var(--team-color,#c4ff68);border-radius:28px;padding:32px;overflow:hidden;position:relative;box-shadow:0 20px 70px #0004}.receipt-card h2{font-size:clamp(24px,5vw,42px);margin:16px 0}.receipt-card .receipt-mascot{float:right;width:clamp(90px,24vw,200px);margin:0 0 20px 20px}.receipt-card li{margin:14px 0}.receipt-card small{overflow-wrap:anywhere}.receipt-code{color:#c4ff68;font-variant-numeric:tabular-nums}.manage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin:24px 0}.manage-form{display:grid;gap:14px}.manage-form label{display:grid;gap:8px}.user-row,.log-row{padding:18px 0;border-bottom:1px solid #34516e;overflow-wrap:anywhere}.user-row form{display:flex;gap:10px;flex-wrap:wrap}.user-row select{color:#fff;background:#18344f;border:1px solid #56728d;border-radius:8px;padding:8px}.line-login{background:#06c755;color:white}.manager-error,#registrationError{color:#ffb9b9}.badge-live{color:#bcff40}.status-summary{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.status-summary span{background:#15324d;border-radius:12px;padding:12px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7ff4f;outline-offset:4px}@media(max-width:600px){.contact-row{grid-template-columns:1fr}.receipt-card{padding:22px}.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-card{padding:14px}.manage-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=value=>window.Satun.escapeHTML(value);let data=null,selectedTeam='',selectedSport='',receipt=null,requestId=null,locked=false,manager=null;
const dateLabel=value=>new Date(value).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'long',timeStyle:'short'});
function updateCountdowns(){
 const events=window.Satun.events,now=Date.now();
 document.querySelectorAll('[data-countdown]').forEach(el=>{
  const list=events.filter(e=>e.id===el.dataset.countdown),live=list.find(e=>e.status==='live');
  if(live){el.textContent='● กำลังแข่งขัน • '+(live.venue||'ติดตามผลการแข่งขัน');return}
  const next=list.find(e=>e.date.getTime()>now&&!['cancelled','postponed','final'].includes(e.status));
  if(next){const total=Math.max(0,Math.floor((next.date-now)/1000)),days=Math.floor(total/86400),hours=String(Math.floor(total%86400/3600)).padStart(2,'0'),minutes=String(Math.floor(total%3600/60)).padStart(2,'0'),seconds=String(total%60).padStart(2,'0');el.textContent='เหลือ '+days+' วัน '+hours+':'+minutes+':'+seconds+' • '+dateLabel(next.date);return}
  el.textContent=list.some(e=>e.status==='postponed')?'เลื่อนการแข่งขัน • รอประกาศวันใหม่':list.some(e=>!['cancelled','final'].includes(e.status))?'ถึงเวลาแข่งขันแล้ว • รออัปเดตผล':list.length?'สิ้นสุดรายการแข่งขัน':'รอประกาศกำหนดการ';
 });
}
$('registrationForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.target;if(!form.reportValidity())return;const button=form.querySelector('[type=submit]');button.disabled=true;try{const obj={sport:$('regSport').value,type:$('regType').value,agency:$('regAgency').value.trim(),name:$('regName').value.trim(),phone:$('regPhone').value.trim(),team:$('regTeam').value.trim(),email:$('regEmail').value.trim(),note:$('regNote').value.trim(),consent:$('regConsent').checked};const result=await window.Satun.rpc('registerParticipant',obj);form.reset();window.Satun.toast('ส่งใบสมัครแล้ว เลขอ้างอิง: '+result.id)}catch(error){window.Satun.toast(error.message)}finally{button.disabled=false}});
function selected(collection,id){return (collection||[]).find(x=>x.id===id)}
function renderChoices(){
 if(!data?.teams?.length){$('legacyRegistration').hidden=false;$('coordinatorWizard').hidden=true;const oldSport=$('regSport').value;$('regSport').innerHTML='<option value="">เลือกประเภทกีฬา</option>'+data.sports.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');$('regSport').value=oldSport;return}
 $('legacyRegistration').hidden=true;if(!receipt)$('coordinatorWizard').hidden=false;
 $('teamChoices').innerHTML=data.teams.map(team=>`<button type="button" class="choice-card" data-team="${esc(team.id)}" aria-pressed="${selectedTeam===team.id}" style="--team-color:${/^#[a-f0-9]{6}$/i.test(team.color)?team.color:'#777777'}"><span class="team-dot"></span><strong>${esc(team.name)}</strong><small>${esc(team.agency)}</small></button>`).join('');
 $('sportChoices').innerHTML=data.sports.map(s=>`<button type="button" class="choice-card" data-coordinator-sport="${esc(s.id)}" aria-pressed="${selectedSport===s.id}"><strong>${esc(s.icon)} ${esc(s.name)}</strong><small>ลงทะเบียนผู้รับผิดชอบกีฬา</small></button>`).join('');
}
function invalidateSummary(){requestId=null;$('summaryStep').hidden=true;$('coordinatorConsent').checked=false;}
$('teamChoices').addEventListener('click',event=>{const button=event.target.closest('[data-team]');if(!button||locked)return;selectedTeam=button.dataset.team;selectedSport='';$('sportStep').hidden=false;$('contactsStep').hidden=true;invalidateSummary();renderChoices();$('sportStep').scrollIntoView({behavior:'smooth',block:'start'})});
$('sportChoices').addEventListener('click',event=>{const button=event.target.closest('[data-coordinator-sport]');if(!button||locked)return;selectedSport=button.dataset.coordinatorSport;$('contactsStep').hidden=false;$('contactsTitle').textContent='3. ผู้รับผิดชอบกีฬา '+selected(data.sports,selectedSport).name;invalidateSummary();renderChoices();$('contactsStep').scrollIntoView({behavior:'smooth',block:'start'})});
function addContact(name='',phone=''){
 if($('contactRows').children.length>=10)return;
 const row=document.createElement('div');row.className='contact-row';row.innerHTML=`<label>ชื่อ–นามสกุลผู้รับผิดชอบ<input class="contact-name" autocomplete="name" maxlength="100" required value="${esc(name)}"></label><label>เบอร์โทรติดต่อ<input class="contact-phone" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9+\\- ]{9,15}" maxlength="15" required value="${esc(phone)}"></label><button type="button" class="btn btn-outline remove-contact" aria-label="ลบผู้รับผิดชอบคนนี้">ลบ</button>`;$('contactRows').append(row);syncContactButtons();
}
function syncContactButtons(){$('addContact').disabled=$('contactRows').children.length>=10;document.querySelectorAll('.remove-contact').forEach(b=>b.disabled=$('contactRows').children.length===1)}
$('addContact').addEventListener('click',()=>{if(!locked){addContact();invalidateSummary()}});
$('contactRows').addEventListener('click',event=>{if(event.target.closest('.remove-contact')&&!locked&&$('contactRows').children.length>1){event.target.closest('.contact-row').remove();syncContactButtons();invalidateSummary()}});
$('contactRows').addEventListener('input',()=>{if(!locked)invalidateSummary()});addContact();
function contacts(){return [...document.querySelectorAll('#contactRows .contact-row')].map(row=>({name:row.querySelector('.contact-name').value.trim(),phone:row.querySelector('.contact-phone').value.trim()}))}
function summaryMarkup(value){const team=selected(data.teams,value.team),sport=selected(data.sports,value.sport);return `<h3>${esc(team.name)} • ${esc(sport.name)}</h3><p>${esc(team.agency)}</p><ul>${value.contacts.map(c=>`<li><strong>${esc(c.name)}</strong> — ${esc(c.phone)}</li>`).join('')}</ul>`}
$('coordinatorForm').addEventListener('submit',event=>{event.preventDefault();if(locked||!selectedTeam||!selectedSport||!event.target.reportValidity())return;if(contacts().some(c=>!c.name||!c.phone))return;requestId=requestId||crypto.randomUUID();$('registrationSummary').innerHTML=summaryMarkup({team:selectedTeam,sport:selectedSport,contacts:contacts()});$('summaryStep').hidden=false;$('coordinatorConsent').checked=false;$('summaryStep').scrollIntoView({behavior:'smooth',block:'start'})});
$('editCoordinator').addEventListener('click',()=>{if(!locked){invalidateSummary();$('contactsStep').scrollIntoView({behavior:'smooth'})}});
function freeze(value){locked=value;document.querySelectorAll('#coordinatorWizard button,#coordinatorWizard input').forEach(el=>el.disabled=value);if(!value)syncContactButtons()}
$('confirmCoordinator').addEventListener('submit',async event=>{
 event.preventDefault();if(locked||!requestId||!event.target.reportValidity()||!$('coordinatorConsent').checked)return;
 const payload={team:selectedTeam,sport:selectedSport,contacts:contacts(),consent:true,requestId};freeze(true);$('registrationError').textContent='';
 try{receipt=await window.Satun.rpc('registerCoordinator',payload);$('coordinatorWizard').hidden=true;const team=selected(data.teams,receipt.team);$('registrationReceipt').style.setProperty('--team-color',team.color);const mascot=document.querySelector('.hero-mascot').src;$('registrationReceipt').innerHTML=`<img class="receipt-mascot" src="${esc(mascot)}" alt="มาสคอตกีฬา"><div class="eyebrow">SATUN SPORTS 2570</div><h2>ลงทะเบียนสำเร็จ ✓</h2>${summaryMarkup(receipt)}<p>${esc(dateLabel(receipt.created))}</p><small>เลขอ้างอิง <span class="receipt-code">${esc(receipt.id)}</span></small>`;$('receiptStep').hidden=false;$('receiptStep').scrollIntoView({behavior:'smooth',block:'start'});}
 catch(error){$('registrationError').textContent=error.message+' — ข้อมูลยังอยู่ สามารถลองส่งอีกครั้งได้';}
 finally{freeze(false)}
});
$('newCoordinator').addEventListener('click',()=>{selectedTeam='';selectedSport='';receipt=null;requestId=null;$('receiptStep').hidden=true;$('coordinatorWizard').hidden=false;$('sportStep').hidden=true;$('contactsStep').hidden=true;invalidateSummary();$('contactRows').innerHTML='';addContact();renderChoices();$('teamStep').scrollIntoView({behavior:'smooth'})});
async function saveReceipt(type){
 if(!receipt)return;const button=type==='png'?$('savePng'):$('saveJpg');button.disabled=true;
 try{
  await document.fonts.ready;
  const canvas=document.createElement('canvas');canvas.width=1600;
  const ctx=canvas.getContext('2d');ctx.font='36px sans-serif';
  const wrap=(text,width)=>{const lines=[];let line='';for(const char of String(text)){if(ctx.measureText(line+char).width>width&&line){lines.push(line);line=''}line+=char}if(line)lines.push(line);return lines};
  const contactLines=receipt.contacts.map(c=>wrap(c.name+' • '+c.phone,1400));
  canvas.height=750+contactLines.reduce((n,lines)=>n+lines.length*50+25,0);
  const gradient=ctx.createLinearGradient(0,0,1600,canvas.height);gradient.addColorStop(0,'#143a65');gradient.addColorStop(1,'#06162d');ctx.fillStyle=gradient;ctx.fillRect(0,0,canvas.width,canvas.height);
  const team=selected(data.teams,receipt.team),sport=selected(data.sports,receipt.sport);ctx.fillStyle=team.color;ctx.fillRect(0,0,1600,24);ctx.fillStyle='#c4ff68';ctx.font='bold 34px sans-serif';ctx.fillText('SATUN SPORTS 2570',80,100);
  const mascot=document.querySelector('.hero-mascot');await mascot.decode();ctx.drawImage(mascot,1200,70,300,300*mascot.naturalHeight/mascot.naturalWidth);
  ctx.fillStyle='white';ctx.font='bold 64px sans-serif';ctx.fillText('ลงทะเบียนผู้รับผิดชอบกีฬา',80,205);ctx.font='bold 60px sans-serif';ctx.fillText(team.name+' • '+sport.name,80,305);ctx.font='32px sans-serif';ctx.fillStyle='#d0daeb';ctx.fillText(team.agency,80,375);
  ctx.fillStyle='#c4ff68';ctx.font='bold 40px sans-serif';ctx.fillText('บันทึกข้อมูลสำเร็จ',80,470);ctx.font='36px sans-serif';ctx.fillStyle='white';let y=550;
  contactLines.forEach(lines=>{lines.forEach(line=>{ctx.fillText(line,80,y);y+=50});y+=25});
  ctx.font='28px sans-serif';ctx.fillStyle='#c4d4e4';ctx.fillText(dateLabel(receipt.created),80,y+50);ctx.fillText('เลขอ้างอิง: '+receipt.id,80,y+100);ctx.fillStyle='#c4ff68';ctx.fillText('กีฬา สา’สุข สตูล • SPORT · HEALTH · UNITY',80,y+160);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,type==='png'?'image/png':'image/jpeg',.94));if(!blob)throw Error('สร้างภาพไม่สำเร็จ');const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='satun-'+receipt.id+'.'+type;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(error){window.Satun.toast('บันทึกภาพไม่สำเร็จ: '+error.message)}finally{button.disabled=false}
}
$('savePng').addEventListener('click',()=>saveReceipt('png'));$('saveJpg').addEventListener('click',()=>saveReceipt('jpg'));
async function manage(method,...args){const response=await fetch('/api/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,args})});const result=await response.json();if(!result.ok)throw Error(result.error);return result.data}
function statusText(status){return ({scheduled:'รอแข่งขัน',live:'กำลังแข่งขัน',final:'จบการแข่งขัน',postponed:'เลื่อนการแข่งขัน',cancelled:'ยกเลิก'})[status]||status}
async function loadManager(){
 const identity=$('managerIdentity');$('managerContent').hidden=true;
 if(!window.SATUN_VERCEL){identity.innerHTML='หน้าจัดการ LINE ใช้บนเว็บไซต์หลัก <a class="btn line-login" href="https://mophstnsport.vercel.app/#manager">ไปเว็บไซต์หลัก</a>';return}
 identity.textContent='กำลังตรวจสอบบัญชี…';
 try{const response=await fetch('/api/auth/session',{cache:'no-store'}),result=await response.json();if(!response.ok)throw Error(result.error);manager=result.user;
  if(!manager){identity.innerHTML='<p>เข้าสู่ระบบด้วย LINE เพื่อขอสิทธิ์จัดการเว็บไซต์</p><a class="btn line-login" href="/api/auth/line">เข้าสู่ระบบด้วย LINE</a>'+ (new URL(location.href).searchParams.get('line_login')==='failed'?'<p class="manager-error">เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจการตั้งค่า LINE และลองอีกครั้ง</p>':'');return}
  identity.innerHTML=`<p>สวัสดี ${esc(manager.lineName)} • ${esc(manager.role)} / ${esc(manager.status)}</p><small>LINE User ID: ${esc(manager.id)}</small><p><button id="logoutLine" class="btn btn-outline">ออกจากระบบ</button></p>`;
  $('logoutLine').onclick=async()=>{try{const response=await fetch('/api/auth/logout',{method:'POST'});if(!response.ok)throw Error('ออกจากระบบไม่สำเร็จ');manager=null;await loadManager()}catch(error){window.Satun.toast(error.message)}};
  if(manager.status!=='active'||!['owner','manager'].includes(manager.role)){identity.insertAdjacentHTML('beforeend','<p>บัญชีนี้ยังไม่มีสิทธิ์จัดการข้อมูล กรุณาให้เจ้าของเว็บไซต์อนุมัติ หรือกดโหลดหน้าใหม่หลังได้รับสิทธิ์</p>');return}
  if(!data){identity.insertAdjacentHTML('beforeend','<p>กำลังรอข้อมูลเว็บไซต์ กรุณาโหลดหน้าใหม่หากเชื่อมต่อ Google ไม่สำเร็จ</p>');return}
  const content=await manage('getManagementData');renderManager(content);$('managerContent').hidden=false;
 }catch(error){identity.textContent='ตรวจสอบบัญชีไม่ได้: '+error.message}
}
function localDate(value){const d=new Date(value);return new Date(d.getTime()+7*3600000).toISOString().slice(0,16)}
function renderManager(content){
 const root=$('managerContent');const oldScore=$('scoreForm').closest('.panel'),oldNews=$('newsForm').closest('.panel');
 // Keep the existing forms and their event listeners when refreshing the manager view.
 oldScore.remove();oldNews.remove();
 root.innerHTML=`<div class="status-summary"><span>${content.events.length} รายการแข่ง</span><span>${content.coordinators.filter(r=>r.action==='create').length} ใบลงทะเบียน</span><span>${content.coordinators.length} ประวัติการลงทะเบียน/แก้ไข</span></div><p id="managerError" class="manager-error" role="alert"></p><div class="manage-grid"><div class="panel"><h2>โปรแกรมแข่งขัน</h2><form id="eventEditor" class="manage-form"><label>เลือกรายการ / เพิ่มใหม่<select id="manageEvent"><option value="">＋ เพิ่มรายการ</option>${content.events.map(e=>`<option value="${esc(e.eventKey)}">${esc(e.label)} • ${esc(dateLabel(e.startsAt))}</option>`).join('')}</select></label><label>รหัสรายการ (a-z, 0-9, -)<input name="eventKey" required pattern="[a-zA-Z0-9_-]+" maxlength="80"></label><label>กีฬา<select name="sport">${data.sports.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label><label>ชื่อรายการ / รอบแข่งขัน<input name="label" required maxlength="120"></label><label>วันเวลาแข่งขัน (ประเทศไทย)<input name="startsAt" type="datetime-local" required></label><label>สถานที่<input name="venue" maxlength="200"></label><label>สถานะ<select name="status">${['scheduled','live','final','postponed','cancelled'].map(s=>`<option value="${s}">${statusText(s)}</option>`).join('')}</select></label><button type="submit" class="btn btn-lime">บันทึกรายการแข่ง</button></form></div><div class="panel"><h2>ข้อมูลกีฬา</h2><form id="sportEditor" class="manage-form"><label>กีฬา<select name="id">${data.sports.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label><label>ชื่อกีฬา<input name="name" maxlength="100" required></label><label>ชื่อย่อ<input name="short" maxlength="40" required></label><button type="submit" class="btn btn-sky">บันทึกข้อมูลกีฬา</button></form></div></div><div id="scoreNewsEditors" class="manage-grid"></div><div class="panel"><h2>แก้ไขข่าว/ประกาศที่เผยแพร่</h2><form id="existingNewsEditor" class="manage-form"><label>เลือกข่าว<select name="id">${data.articles.map(n=>`<option value="${esc(n.id)}">${esc(n.title)}</option>`).join('')}</select></label><label>หมวด<select name="type"><option>ข่าว</option><option>ประกาศ</option><option>รายงานกิจกรรม</option></select></label><label>หัวข้อ<input name="title" required maxlength="200"></label><label>รายละเอียด<textarea name="body" rows="4" required maxlength="10000"></textarea></label><button type="submit" class="btn btn-outline">บันทึกแก้ไขข่าว</button></form></div><div class="panel"><h2>ประวัติลงทะเบียนผู้รับผิดชอบ</h2><p>ส่งซ้ำได้ ทุกการส่งและแก้ไขจะเพิ่ม log ใหม่ ไม่มีการทับประวัติ</p><div id="coordinatorLogs"></div></div>${manager.role==='owner'?'<div class="panel"><h2>จัดการผู้ใช้งาน LINE</h2><p>อนุมัติเฉพาะบุคคลที่ทราบตัวตนจริง ชื่อ LINE เปลี่ยนได้ ให้ตรวจ LINE User ID ประกอบ</p><div id="lineUsers"></div></div><div class="panel"><h2>ประวัติจัดการเว็บไซต์</h2><div id="auditList"></div></div>':''}`;
 $('scoreNewsEditors').append(oldScore,oldNews);
 const form=$('eventEditor');$('manageEvent').onchange=()=>{const e=content.events.find(e=>e.eventKey===$('manageEvent').value);for(const key of ['eventKey','sport','label','venue','status'])form.elements[key].value=e?.[key]|| (key==='status'?'scheduled':key==='sport'?data.sports[0].id:'');form.elements.eventKey.readOnly=!!e;form.elements.startsAt.value=e?localDate(e.startsAt):''};
 const sportForm=$('sportEditor');const loadSport=()=>{const s=data.sports.find(s=>s.id===sportForm.elements.id.value);sportForm.elements.name.value=s.name;sportForm.elements.short.value=s.short};sportForm.elements.id.onchange=loadSport;loadSport();
 async function submit(form,method,payload){const button=form.querySelector('[type=submit]');button.disabled=true;$('managerError').textContent='';try{await manage(method,payload);await window.Satun.refresh();window.Satun.toast('บันทึกข้อมูลแล้ว');await loadManager()}catch(error){$('managerError').textContent=error.message}finally{button.disabled=false}}
 form.onsubmit=e=>{e.preventDefault();const value=Object.fromEntries(new FormData(form));value.startsAt+=':00+07:00';submit(form,'saveEvent',value)};
 const newsForm=$('existingNewsEditor');const loadNews=()=>{const n=data.articles.find(n=>n.id===newsForm.elements.id.value);if(n){for(const key of ['type','title','body'])newsForm.elements[key].value=n[key]}newsForm.querySelector('[type=submit]').disabled=!n};newsForm.elements.id.onchange=loadNews;loadNews();newsForm.onsubmit=e=>{e.preventDefault();submit(newsForm,'updateNews',Object.fromEntries(new FormData(newsForm)))};
 sportForm.onsubmit=e=>{e.preventDefault();submit(sportForm,'saveSport',Object.fromEntries(new FormData(sportForm)))};
 const latest=new Map();content.coordinators.forEach(row=>latest.set(row.id,row));
 $('coordinatorLogs').innerHTML=content.coordinators.slice().reverse().map(row=>{let contacts=[];try{contacts=JSON.parse(row.contacts)}catch{}const team=selected(data.teams,row.team),sport=selected(data.sports,row.sport);return `<div class="log-row"><strong>${esc(team?.name||row.team)} • ${esc(sport?.name||row.sport)}</strong><p>${contacts.map(c=>esc(c.name)+' '+esc(c.phone)).join('<br>')}</p><small>${esc(row.id)} • ${esc(row.action)} • ${esc(dateLabel(row.created))} • ${esc(row.actor)}</small>${latest.get(row.id)===row?`<details><summary>แก้ไขผู้รับผิดชอบ (เพิ่ม log ใหม่)</summary><form class="manage-form coordinator-edit" data-id="${esc(row.id)}"><label>หนึ่งคนต่อบรรทัด: ชื่อ | เบอร์โทร<textarea name="contacts" rows="4" required>${contacts.map(c=>esc(c.name)+' | '+esc(c.phone)).join('\n')}</textarea></label><button type="submit" class="btn btn-outline">บันทึกแก้ไข</button></form></details>`:''}</div>`}).join('')||'<p>ยังไม่มีรายการลงทะเบียน</p>';
 document.querySelectorAll('.coordinator-edit').forEach(f=>f.onsubmit=e=>{e.preventDefault();const contacts=f.elements.contacts.value.split('\n').filter(l=>l.trim()).map(line=>{const [name,phone]=line.split('|').map(s=>s.trim());return {name,phone}});submit(f,'updateCoordinator',{id:f.dataset.id,contacts})});
 if(manager.role==='owner'){
  $('lineUsers').innerHTML=content.users.map(u=>`<div class="user-row"><strong>${esc(u.lineName)}</strong><p>${esc(u.id)}</p><form class="user-editor" data-user="${esc(u.id)}"><select name="role" aria-label="สิทธิ์ ${esc(u.lineName)}">${['viewer','manager','owner'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r}</option>`).join('')}</select><select name="status" aria-label="สถานะ ${esc(u.lineName)}">${['pending','active','disabled'].map(s=>`<option value="${s}" ${s===u.status?'selected':''}>${s}</option>`).join('')}</select><button type="submit" class="btn btn-outline" ${u.id===manager.id?'disabled':''}>บันทึกสิทธิ์</button></form></div>`).join('');
  document.querySelectorAll('.user-editor').forEach(f=>f.onsubmit=e=>{e.preventDefault();submit(f,'updateLineUser',{id:f.dataset.user,...Object.fromEntries(new FormData(f))})});
  $('auditList').innerHTML=content.audit.map(row=>`<p class="log-row">${esc(dateLabel(row.created))} • ${esc(row.action)} • ${esc(row.actor)} • ${esc(row.target)}</p>`).join('')||'<p>ยังไม่มีประวัติ</p>';
 }
}
const syncStatus=document.createElement('p');syncStatus.id='lastSync';syncStatus.className='help';$('upcomingList').before(syncStatus);
const calendarPicker=document.createElement('input');calendarPicker.type='month';calendarPicker.value='2026-11';calendarPicker.setAttribute('aria-label','เลือกเดือนและปีปฏิทิน');calendarPicker.className='filter';$('calendarTitle').after(calendarPicker);calendarPicker.onchange=()=>{if(calendarPicker.value){const [year,month]=calendarPicker.value.split('-').map(Number);window.Satun.setCalendar(year,month)}};
window.addEventListener('satun:data',event=>{data=event.detail;$('lastSync').textContent='ข้อมูลล่าสุด: '+new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})+' • อัปเดตอัตโนมัติทุก 60 วินาที';renderChoices();updateCountdowns();if(location.hash.startsWith('#manager')&&$('managerContent').hidden)loadManager()});
window.addEventListener('satun:route',event=>{if(event.detail==='manager')loadManager()});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#manager'))loadManager()});
setInterval(updateCountdowns,1000);setInterval(()=>{if(!document.hidden)window.Satun.refresh().catch(()=>{})},60000);
if(location.hash.startsWith('#manager'))loadManager();
})();
</script>
