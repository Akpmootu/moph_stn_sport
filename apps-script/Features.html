p:14px}.manage-form label{display:grid;gap:8px}.user-row,.log-row{padding:18px 0;border-bottom:1px solid #34516e;overflow-wrap:anywhere}.user-row form{display:flex;gap:10px;flex-wrap:wrap}.user-row select{color:#fff;background:#18344f;border:1px solid #56728d;border-radius:8px;padding:8px}.line-login{background:#06c755;color:white}.manager-error,#registrationError{color:#ffb9b9}.badge-live{color:#bcff40}.status-summary{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.status-summary span{background:#15324d;border-radius:12px;padding:12px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7ff4f;outline-offset:4px}@media(max-width:600px){.contact-row{grid-template-columns:1fr}.receipt-card{padding:22px}.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-card{padding:14px}.manage-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=value=>window.Satun.escapeHTML(value);let data=null,selectedTeam='',selectedSport='',receipt=null,requestId=null,locked=false,manager=null;
const dateLabel=value=>new Date(value).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'long',timeStyle:'short'});
function updateCountdowns(){
 const events=window.Satun.events,now=Date.now();
 document.querySelectorAll('[data-countdown]').forEach(el=>{
  const list=events.filter(e=>e.id===el.dataset.countdown),live=list.find(e=>e.status==='live');
  if(live){el.textContent='● กำลังแข่งขัน • '+(live.venue||'ติดตามผลการแข่งขัน');return}
  const next=list.find(e=>e.date.getTime()>now&&!['cancelled','postponed','final'].includes(e.status));
  if(next){const total=Math.max(0,Math.floor((next.date-now)/1000)),days=Math.floor(total/86400),hours=String(Math.floor(total%86400/3600)).padStart(2,'0'),minutes=String(Math.floor(total%3600/60)).padStart(2,'0'),seconds=String(total%60).padStart(2,'0');el.textContent='เหลือ '+days+' วัน '+hours+':'+minutes+':'+seconds+' • '+dateLabel(next.date);return}
  el.textContent=list.some(e=>e.status==='postponed')?'เลื่อนการแข่งขัน • รอประกาศวันใหม่':list.some(e=>!['cancelled','final'].includes(e.status))?'ถึงเวลาแข่งขันแล้ว • รออัปเดตผล':list.length?'สิ้นสุดรายการแข่งขัน':'รอประกาศกำหนดการ';
 });
}
$('registrationForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.target;if(!form.reportValidity())return;const button=form.querySelector('[type=submit]');button.disabled=true;try{const obj={sport:$('regSport').value,type:$('regType').value,agency:$('regAgency').value.trim(),name:$('regName').value.trim(),phone:$('regPhone').value.trim(),team:$('regTeam').value.trim(),email:$('regEmail').value.trim(),note:$('regNote').value.trim(),consent:$('regConsent').checked};const result=await window.Satun.rpc('registerParticipant',obj);form.reset();window.Satun.toast('ส่งใบสมัครแล้ว เลขอ้างอิง: '+result.id)}catch(error){window.Satun.toast(error.message)}finally{button.disabled=false}});
function selected(collection,id){return (collection||[]).find(x=>x.id===id)}
function assignment(sport){return (data?.coordinatorAssignments||[]).find(row=>row.team===selectedTeam&&row.sport===sport)}
function teamInk(color){
 const rgb=color.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);
 return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722>.179?'#111111':'#ffffff';
}
function renderChoices(){
 if(!data?.teams?.length){$('legacyRegistration').hidden=false;$('coordinatorWizard').hidden=true;const oldSport=$('regSport').value;$('regSport').innerHTML='<option value="">เลือกประเภทกีฬา</option>'+data.sports.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');$('regSport').value=oldSport;return}
 $('legacyRegistration').hidden=true;if(!receipt)$('coordinatorWizard').hidden=false;
 $('teamChoices').innerHTML=data.teams.map(team=>`<button type="button" class="choice-card" data-team="${esc(team.id)}" aria-pressed="${selectedTeam===team.id}" style="--team-ink:${teamInk(/^#[a-f0-9]{6}$/i.test(team.color)?team.color:'#777777')};--team-color:${/^#[a-f0-9]{6}$/i.test(team.color)?team.color:'#777777'}"><span class="team-dot"></span><strong>${esc(team.name)}</strong><small>${esc(team.agency)}</small></button>`).join('');
 $('sportChoices').innerHTML=data.sports.map(s=>{
  const existing=assignment(s.id),ready=Array.isArray(data.coordinatorAssignments);
  return `<button type="button" class="choice-card sport-choice" data-coordinator-sport="${esc(s.id)}" aria-pressed="${selectedSport===s.id}" ${existing||!ready?'disabled':''} style="--sport-art:url('assets/sport-${esc(s.id)}.svg')"><span class="sport-art" aria-hidden="true"></span><img class="sport-mascot" src="assets/mascot-${esc(s.id)}.svg" alt=""><strong>${esc(s.icon)} ${esc(s.name)}</strong><small>${existing?'ลงทะเบียนแล้ว · '+existing.names.map(esc).join(', ')+' — กรุณาประสานงานผู้รับผิดชอบ':ready?'เปิดรับผู้รับผิดชอบ':'กำลังรอเปิดระบบลงทะเบียน กรุณาติดต่อผู้จัด'}</small></button>`;
 }).join('');

}
function showRegistrationStep(index){
 ['teamStep','sportStep','contactsStep','summaryStep'].forEach((id,i)=>$(id).hidden=i!==index);
 document.querySelectorAll('[data-reg-step]').forEach(button=>{
  const step=Number(button.dataset.regStep);
  button.disabled=locked||(step===1&&!selectedTeam)||(step===2&&!selectedSport)||(step===3&&!requestId);
  if(step===index)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');
  button.onclick=()=>{if(!button.disabled)showRegistrationStep(step)};
 });
}
function invalidateSummary(){requestId=null;$('summaryStep').hidden=true;$('coordinatorConsent').checked=false;}
$('teamChoices').addEventListener('click',event=>{const button=event.target.closest('[data-team]');if(!button||locked)return;selectedTeam=button.dataset.team;selectedSport='';$('sportStep').hidden=false;$('contactsStep').hidden=true;invalidateSummary();renderChoices();showRegistrationStep(1);$('sportStep').scrollIntoView({behavior:'smooth',block:'start'})});
$('sportChoices').addEventListener('click',event=>{const button=event.target.closest('[data-coordinator-sport]');if(!button||locked||button.disabled||assignment(button.dataset.coordinatorSport))return;selectedSport=button.dataset.coordinatorSport;$('contactsStep').hidden=false;$('contactsTitle').textContent='3. ผู้รับผิดชอบกีฬา '+selected(data.sports,selectedSport).name;invalidateSummary();renderChoices();showRegistrationStep(2);$('contactsStep').scrollIntoView({behavior:'smooth',block:'start'})});
function addContact(name='',phone=''){
 if($('contactRows').children.length>=10)return;
 const row=document.createElement('div');row.className='contact-row';row.innerHTML=`<label>ชื่อ–นามสกุลผู้รับผิดชอบ<input class="contact-name" autocomplete="name" maxlength="100" required value="${esc(name)}"></label><label>เบอร์โทรติดต่อ<input class="contact-phone" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9+\\- ]{9,15}" maxlength="15" required value="${esc(phone)}"></label><button type="button" class="btn btn-outline remove-contact" aria-label="ลบผู้รับผิดชอบคนนี้">ลบ</button>`;$('contactRows').append(row);syncContactButtons();
}
function syncContactButtons(){$('addContact').disabled=$('contactRows').children.length>=10;document.querySelectorAll('.remove-contact').forEach(b=>b.disabled=$('contactRows').children.length===1)}
$('addContact').addEventListener('click',()=>{if(!locked){addContact();invalidateSummary()}});
$('contactRows').addEventListener('click',event=>{if(event.target.closest('.remove-contact')&&!locked&&$('contactRows').children.length>1){event.target.closest('.contact-row').remove();syncContactButtons();invalidateSummary()}});
$('contactRows').addEventListener('input',()=>{if(!locked)invalidateSummary()});addContact();
function contacts(){return [...document.querySelectorAll('#contactRows .contact-row')].map(row=>({name:row.querySelector('.contact-name').value.trim(),phone:row.querySelector('.contact-phone').value.trim()}))}
function summaryMarkup(value){const team=selected(data.teams,value.team),sport=selected(data.sports,value.sport);return `<h3>${esc(team.name)} • ${esc(sport.name)}</h3><p>${esc(team.agency)}</p><ul>${value.contacts.map(c=>`<li><strong>${esc(c.name)}</strong> — ${esc(c.phone)}</li>`).join('')}</ul>`}

async function saveReceipt(type){
 if(!receipt)return;const button=type==='png'?$('savePng'):$('saveJpg');button.disabled=true;
 try{
  await document.fonts.ready;
  const canvas=document.createElement('canvas');canvas.width=1600;
  const ctx=canvas.getContext('2d');ctx.font='36px sans-serif';
  const wrap=(text,width)=>{const lines=[];let line='';for(const char of String(text)){if(ctx.measureText(line+char).width>width&&line){lines.push(line);line=''}line+=char}if(line)lines.push(line);return lines};
  const contactLines=receipt.contacts.map(c=>wrap(c.name+' • '+c.phone,1400));
  canvas.height=750+contactLines.reduce((n,lines)=>n+lines.length*50+25,0);
  const gradient=ctx.createLinearGradient(0,0,1600,canvas.height);gradient.addColorStop(0,'#143a65');gradient.addColorStop(1,'#06162d');ctx.fillStyle=gradient;ctx.fillRect(0,0,canvas.width,canvas.height);
  const team=selected(data.teams,receipt.team),sport=selected(data.sports,receipt.sport);ctx.fillStyle=team.color;ctx.fillRect(0,0,1600,24);ctx.fillStyle='#c4ff68';ctx.font='bold 34px sans-serif';ctx.fillText('SATUN SPORTS 2570',80,100);
  const mascot=document.querySelector('.hero-mascot');await mascot.decode();ctx.drawImage(mascot,1200,70,300,300*mascot.naturalHeight/mascot.naturalWidth);
  ctx.fillStyle='white';ctx.font='bold 64px sans-serif';ctx.fillText('ลงทะเบียนผู้รับผิดชอบกีฬา',80,205);ctx.font='bold 60px sans-serif';ctx.fillText(team.name+' • '+sport.name,80,305);ctx.font='32px sans-serif';ctx.fillStyle='#d0daeb';ctx.fillText(team.agency,80,375);
  ctx.fillStyle='#c4ff68';ctx.font='bold 40px sans-serif';ctx.fillText('บันทึกข้อมูลสำเร็จ',80,470);ctx.font='36px sans-serif';ctx.fillStyle='white';let y=550;
  contactLines.forEach(lines=>{lines.forEach(line=>{ctx.fillText(line,80,y);y+=50});y+=25});
  ctx.font='28px sans-serif';ctx.fillStyle='#c4d4e4';ctx.fillText(dateLabel(receipt.created),80,y+50);ctx.fillText('เลขอ้างอิง: '+receipt.id,80,y+100);ctx.fillStyle='#c4ff68';ctx.fillText('กีฬา สา’สุข สตูล • SPORT · HEALTH · UNITY',80,y+160);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,type==='png'?'image/png':'image/jpeg',.94));if(!blob)throw Error('สร้างภาพไม่สำเร็จ');const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='satun-'+receipt.id+'.'+type;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(error){window.Satun.toast('บันทึกภาพไม่สำเร็จ: '+error.message)}finally{button.disabled=false}
}
$('savePng').addEventListener('click',()=>saveReceipt('png'));$('saveJpg').addEventListener('click',()=>saveReceipt('jpg'));
async function manage(method,...args){const response=await fetch('/api/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,args})});const result=await response.json();if(!result.ok)throw Error(result.error);return result.data}
function statusText(status){return ({scheduled:'รอแข่งขัน',live:'กำลังแข่งขัน',final:'จบการแข่งขัน',postponed:'เลื่อนการแข่งขัน',cancelled:'ยกเลิก'})[status]||status}

  if(!data){identity.insertAdjacentHTML('beforeend','<p>กำลังรอข้อมูลเว็บไซต์ กรุณาโหลดหน้าใหม่หากเชื่อมต่อ Google ไม่สำเร็จ</p>');return}

function localDate(value){const d=new Date(value);return new Date(d.getTime()+7*3600000).toISOString().slice(0,16)}
let activeManagerTab='eventEditor';
function organizeManagerPanels(root) {
 const sections=[
  ['eventEditor','โปรแกรมแข่งขัน'], ['sportEditor','ข้อมูลกีฬา'], ['scoreForm','ผลการแข่งขัน'],
  ['newsForm','ข่าวและประกาศ','existingNewsEditor'], ['coordinatorLogs','ผู้รับผิดชอบกีฬา'],
  ['lineUsers','ผู้ใช้งาน LINE'], ['auditList','ประวัติการจัดการ']
 ].filter(([id])=>$(id));
 const workspace=document.createElement('div');
 workspace.className='workspace';
 const menu=document.createElement('div');
 menu.className='workspace-menu';
 menu.setAttribute('role','tablist');
 menu.setAttribute('aria-label','หมวดจัดการเว็บไซต์');
 const panels=document.createElement('div');
 const caption=document.createElement('p');
 caption.className='workspace-caption';
 caption.textContent='หมวดจัดการ · เลื่อนแถบเพื่อดูทุกหมวด';
 workspace.append(caption,menu,panels);
 const mobile=matchMedia('(max-width:760px)');
 function activate(id) {
  activeManagerTab=id;
  for(const button of menu.children) {
   const current=button.dataset.section===id;
   button.setAttribute('aria-selected',String(current));
   button.tabIndex=current?0:-1;
   $(button.getAttribute('aria-controls')).hidden=!current;
  }
 }
 sections.forEach(([id,label,extra],index)=>{
  const button=document.createElement('button');
  button.type='button';
  button.id='tab-'+id;
  button.dataset.section=id;
  button.setAttribute('role','tab');
  button.setAttribute('aria-controls','pane-'+id);
  button.innerHTML='<b aria-hidden="true">'+String(index+1).padStart(2,'0')+'</b>'+label;
  const pane=document.createElement('section');
  pane.id='pane-'+id;
  pane.className='workspace-pane';
  pane.setAttribute('role','tabpanel');
  pane.setAttribute('aria-labelledby',button.id);
  pane.tabIndex=0;
  pane.append($(id).closest('.panel'));
  if(extra) pane.append($(extra).closest('.panel'));
  panels.append(pane);
  menu.append(button);
  button.onclick=()=>activate(id);
 });
 root.querySelectorAll('.manage-grid').forEach(grid=>grid.remove());
 root.append(workspace);
 function orient(){menu.setAttribute('aria-orientation',mobile.matches?'horizontal':'vertical')}
 orient();
 menu.onfocusin=orient;
 menu.onkeydown=event=>{
  const direction=mobile.matches?['ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown'];
  const buttons=[...menu.children], index=buttons.indexOf(event.target);
  let next;
  if(event.key==='Home') next=0;
  else if(event.key==='End') next=buttons.length-1;
  else if(direction.includes(event.key)) next=(index+(event.key===direction[0]?-1:1)+buttons.length)%buttons.length;
  else return;
  event.preventDefault();
  buttons[next].focus();
  buttons[next].click();
 };
 activate(sections.some(([id])=>id===activeManagerTab)?activeManagerTab:sections[0][0]);
}
function renderManager(content){

 $('scoreNewsEditors').append(oldScore,oldNews);
 organizeManagerPanels(root);
 const form=$('eventEditor');$('manageEvent').onchange=()=>{const e=content.events.find(e=>e.eventKey===$('manageEvent').value);for(const key of ['eventKey','sport','label','venue','status'])form.elements[key].value=e?.[key]|| (key==='status'?'scheduled':key==='sport'?data.sports[0].id:'');form.elements.eventKey.readOnly=!!e;form.elements.startsAt.value=e?localDate(e.startsAt):''};
 const sportForm=$('sportEditor');const loadSport=()=>{const s=data.sports.find(s=>s.id===sportForm.elements.id.value);sportForm.elements.name.value=s.name;sportForm.elements.short.value=s.short};sportForm.elements.id.onchange=loadSport;loadSport();
 async function submit(form,method,payload){const button=form.querySelector('[type=submit]');button.disabled=true;$('managerError').textContent='';try{await manage(method,payload);await window.Satun.refresh();window.Satun.toast('บันทึกข้อมูลแล้ว');await loadManager()}catch(error){$('managerError').textContent=error.message}finally{button.disabled=false}}
 form.onsubmit=e=>{e.preventDefault();const value=Object.fromEntries(new FormData(form));value.startsAt+=':00+07:00';submit(form,'saveEvent',value)};
 const newsForm=$('existingNewsEditor');const loadNews=()=>{const n=data.articles.find(n=>n.id===newsForm.elements.id.value);if(n){for(const key of ['type','title','body'])newsForm.elements[key].value=n[key]}newsForm.querySelector('[type=submit]').disabled=!n};newsForm.elements.id.onchange=loadNews;loadNews();newsForm.onsubmit=e=>{e.preventDefault();submit(newsForm,'updateNews',Object.fromEntries(new FormData(newsForm)))};
 sportForm.onsubmit=e=>{e.preventDefault();submit(sportForm,'saveSport',Object.fromEntries(new FormData(sportForm)))};
 const latest=new Map();content.coordinators.forEach(row=>latest.set(row.id,row));
